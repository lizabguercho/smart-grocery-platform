[project]
name = "smart-grocery-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "pandas>=3.0.3",
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "pydantic-ai>=0.20.0",
    "pydantic-ai-skills>=0.1.0",
    "fastapi>=0.115.0",
    "sse-starlette>=2.1.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["test/unit"]
pythonpath = ["."]
